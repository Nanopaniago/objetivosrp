<!doctype html>

  <head>
    <script>
      (function () {
        try {
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch') || Object.getOwnPropertyDescriptor(Object.getPrototypeOf(window), 'fetch');
          var currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
          if (desc && !desc.set && desc.configurable) {
            Object.defineProperty(window, 'fetch', {
              get: function () {
                return currentFetch;
              },
              set: function (fn) {
                currentFetch = fn;
              },
              configurable: true,
              enumerable: true,
            });
          }
        } catch (e) {
          // silent fallback
        }
      })();
    </script>
