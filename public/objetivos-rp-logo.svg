<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d1e"/>
      <stop offset="50%" stop-color="#0d1838"/>
      <stop offset="100%" stop-color="#050a16"/>
    </linearGradient>
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0071e3"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="glowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0071e3" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="url(#glowBorder)" stroke-width="8"/>

  <!-- Subtle Target Radar Rings in Background -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#38bdf8" stroke-opacity="0.12" stroke-width="3" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="110" fill="none" stroke="#0071e3" stroke-opacity="0.18" stroke-width="2.5"/>

  <!-- Radar Crosshairs -->
  <line x1="256" y1="76" x2="256" y2="120" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="4" stroke-linecap="round"/>
  <line x1="256" y1="392" x2="256" y2="436" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="4" stroke-linecap="round"/>
  <line x1="76" y1="256" x2="120" y2="256" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="4" stroke-linecap="round"/>
  <line x1="392" y1="256" x2="436" y2="256" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="4" stroke-linecap="round"/>

  <!-- Monogram R and P stylized -->
  <!-- Letter R -->
  <path d="M 148 152 L 224 152 C 264 152 284 172 284 204 C 284 232 266 250 234 254 L 286 360 L 232 360 L 188 266 L 188 360 L 148 360 Z M 188 226 L 220 226 C 238 226 246 218 246 204 C 246 190 238 182 220 182 L 188 182 Z" 
        fill="url(#neonBlue)" 
        filter="url(#glowEffect)"/>

  <!-- Letter P -->
  <path d="M 288 152 L 364 152 C 404 152 424 172 424 204 C 424 236 404 256 364 256 L 328 256 L 328 360 L 288 360 Z M 328 224 L 360 224 C 378 224 386 216 386 204 C 386 192 378 184 360 184 L 328 184 Z" 
        fill="#ffffff" 
        fill-opacity="0.95"/>

  <!-- Precision Bullseye Target Core (RP Center) -->
  <circle cx="360" cy="204" r="8" fill="#38bdf8" filter="url(#glowEffect)"/>
  <circle cx="256" cy="256" r="6" fill="#38bdf8" filter="url(#glowEffect)"/>

  <!-- Futuristic Progress Accent Arc (90 deg neon arc) -->
  <path d="M 390 122 A 190 190 0 0 1 446 256" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" filter="url(#glowEffect)"/>
</svg>
